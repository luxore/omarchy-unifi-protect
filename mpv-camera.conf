# Camera-first pointer controls. mpv normally maps the wheel to volume.
WHEEL_UP add video-zoom 0.10
WHEEL_DOWN add video-zoom -0.10
WHEEL_LEFT add video-pan-x -0.05
WHEEL_RIGHT add video-pan-x 0.05
Ctrl+0 set video-zoom 0
Ctrl+LEFT add video-pan-x -0.05
Ctrl+RIGHT add video-pan-x 0.05
Ctrl+UP add video-pan-y -0.05
Ctrl+DOWN add video-pan-y 0.05
